# nixbook-shell: Qt / KDE colours from the shell's palette (matugen): a
# qt6ct/qt5ct colour scheme ([ColorScheme]) that is also a KDE colour scheme
# (the rest, merged into kdeglobals for KDE apps such as Dolphin).
# Every text colour of [Colors:Selection] is on_primary: it is drawn on the
# primary selection fill, where the surface text roles (on_surface_variant,
# tertiary, error…) can be the same colour (Momonga: about 1:1).
# Adapted from DankMaterialShell's matugen templates
# (https://github.com/AvengeMedia/DankMaterialShell, MIT, (c) 2025 Avenge Media LLC).
