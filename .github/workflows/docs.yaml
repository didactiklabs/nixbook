name: Documentation
# Builds the documentation website (docs/, VitePress) on every PR touching it,
# and deploys it to GitHub Pages from main. The repository's Pages source must
# be set to "GitHub Actions" (Settings → Pages).
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "KEYBINDS.md"
      - "devenv.nix"
      - "devenv.yaml"
      - ".github/workflows/docs.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "KEYBINDS.md"
      - "devenv.nix"
      - "devenv.yaml"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress reads each page's last commit date (lastUpdated).
          fetch-depth: 0
      - name: Pin nixpkgs
        run: echo "NIXPKGS_URL=$(jq -r .pins.nixpkgs.url npins/sources.json)" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS_URL }}
          extra_nix_config: |
            fallback = true
            trusted-public-keys = didactiklabs-nixcache:PxLKN0+ZkP07M8g8/B6xbP6A4MYpqQg6LH7V3muiy/0= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://s3.didactiklabs.io/nix-cache https://cache.nixos.org/
      - name: Install devenv
        run: nix-env -f '<nixpkgs>' -iA devenv
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build documentation
        env:
          NIX_CONFIG: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
        run: devenv shell -- doc-build
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
