name: Build Profiles
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # `closed` is only here so that merging/closing a PR cancels its still
    # queued/running build through the concurrency group below; every job is
    # skipped for that event, so it never takes a runner.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PRs: a new push supersedes the old build. main: never kill a running build
  # or cache push half-way; a newer main push just waits (and replaces any
  # older run still pending).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# GITHUB_TOKEN only reads: the checkout, and skip-duplicate-actions listing
# this workflow's runs. The S3 cache push uses its own secrets.
permissions:
  contents: read
  actions: read
defaults:
  run:
    # Explicit `bash` makes Actions run with `-eo pipefail`, so a failing
    # command in a pipeline fails the step.
    shell: bash
env:
  # base.nix imports this instead of the runner's own
  # /etc/nixos/hardware-configuration.nix: that one has no /boot file system,
  # and since core.nix adds /boot mount options every profile failed with
  # "fileSystems."/boot".fsType was accessed but has no value defined". The
  # same stub the Checks workflow evaluates with.
  NIXBOOK_HARDWARE_CONFIG: ${{ github.workspace }}/tests/hardware-stub.nix
jobs:
  # A pull request from a fork never runs on the self-hosted runners: they
  # share one Nix store with the main builds and the cache push (which holds
  # the S3 and signing keys), so a fork's code must not run there. Its build
  # legs fail on a GitHub-hosted runner instead (see `build`), so the merge gate
  # stays red; push the branch to this repository to build it.
  pre_job:
    if: ${{ github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: self-hosted
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: "never"
          skip_after_successful_duplicate: "true"
          paths_ignore: '["**/README.md", "**/docs/**"]'
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'
  # The machines whose system derivation (toplevel .drv) this change touches,
  # e.g. a pin only one machine uses: the others' systems are byte-for-byte the
  # ones already built (and cached) for the base commit, so their build leg
  # passes without building. Base = the PR's base, or the previous main for a
  # push. main saves its derivations (actions/cache), so the base usually
  # isn't evaluated again. Anything unusual (no base, evaluation error) builds every
  # machine, which also reports the actual error.
  changed:
    timeout-minutes: 60
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: self-hosted
    outputs:
      all: ${{ steps.changed.outputs.all }}
      profiles: ${{ steps.changed.outputs.profiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin nixpkgs for nix-shell
        run: |
          echo "NIX_PATH=nixpkgs=$(jq -r .pins.nixpkgs.url npins/sources.json)" >> "$GITHUB_ENV"
      - name: Base commit
        id: base
        run: echo "sha=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}" >> "$GITHUB_OUTPUT"
      - name: Base derivations (saved by main's build of it)
        if: ${{ steps.base.outputs.sha != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/base-drvs.json
          key: drv-paths-${{ steps.base.outputs.sha }}
      - name: Changed machines
        id: changed
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          all=true profiles='[]'
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            reason="no base commit ($GITHUB_EVENT_NAME)"
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            reason="base $BASE is not in the checkout"
            echo "::warning::$reason, building every machine"
          elif ! changed=$(nix-shell -p colmena --run "tests/changed-hosts.sh --save '$RUNNER_TEMP/drvs.json' --base-map '$RUNNER_TEMP/base-drvs.json' '$BASE'"); then
            reason="could not compare the system derivations with $BASE"
            echo "::warning::$reason, building every machine"
          else
            all=false profiles=$changed
          fi
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/drvs.json" ]; then echo "saved=true" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### Machines to build"
            if [ "$all" = true ]; then
              echo "All of them: $reason."
            elif [ "$profiles" = '[]' ]; then
              echo "None: no machine's system derivation changed since \`$BASE\`."
            else
              jq -r --arg base "$BASE" '"System derivation changed since `\($base)`:", (.[] | "- \(.)")' <<<"$profiles"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save derivations for PRs based on this commit
        if: ${{ github.event_name != 'pull_request' && steps.changed.outputs.saved == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/drvs.json
          key: drv-paths-${{ github.sha }}
  build:
    timeout-minutes: 120
    needs: [pre_job, changed]
    # Runs even if `changed` failed (then it builds everything): its
    # `build (<profile>)` checks are the merge gate, so every leg must report.
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'self-hosted' }}
    env:
      # This machine's system changed (or `changed` couldn't tell).
      BUILD: ${{ needs.changed.result != 'success' || needs.changed.outputs.all == 'true' || contains(fromJson(needs.changed.outputs.profiles), matrix.profile) }}
    strategy:
      # Don't cancel the other profiles when one runner hiccups (e.g. a runner
      # shutdown signal or a transient "SQLite database is busy" lock race on the
      # shared self-hosted Nix store). Each profile's build is independent.
      fail-fast: false
      max-parallel: 3
      matrix:
        profile:
          - totoro
          - anya
          - nishinoya
          - tanjiro
          - hanamichi
    steps:
      - name: Fork pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::pull requests from forks are not built on the self-hosted runners; push the branch to ${{ github.repository }}"
          exit 1
      - name: Unchanged (${{ matrix.profile }})
        if: ${{ env.BUILD != 'true' }}
        run: echo "::notice::${{ matrix.profile }}'s system derivation is unchanged, not rebuilt (see the changed job)"
      - name: Checkout
        if: ${{ env.BUILD == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin nixpkgs for nix-shell
        if: ${{ env.BUILD == 'true' }}
        run: |
          # This should not be a URL, because it would allow PRs to run arbitrary code in CI!
          echo "NIX_PATH=nixpkgs=$(jq -r .pins.nixpkgs.url npins/sources.json)" >> "$GITHUB_ENV"
      - name: Build (${{ matrix.profile }})
        if: ${{ env.BUILD == 'true' }}
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
          PROFILE: ${{ matrix.profile }}
        run: |
          # --keep-result roots the system in .gcroots/ so it survives until
          # the push-cache job picks it up.
          nix-shell -p colmena --run "colmena build --on '$PROFILE' --no-build-on-target --keep-result"
          readlink -e ".gcroots/node-$PROFILE"

  # Uploads every built system closure to the S3 binary cache. Only runs for
  # main (never a PR check, so a flaky upload cannot block a merge). It runs
  # even when some profiles failed to build (`!cancelled()`), so one broken
  # profile does not keep the others out of the cache. A single job with a
  # single `nix copy`: the profiles share most of their closure, and 5 parallel
  # `nix copy`s (each already uploading many paths at once) overloaded the S3
  # endpoint until requests failed with IncompleteBody.
  push-cache:
    timeout-minutes: 120
    needs: [pre_job, build]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Evaluation fetches this repo as a git input, which Nix refuses on a
          # shallow clone; must match the build job's checkout.
          fetch-depth: 0
      - name: Pin nixpkgs for nix-shell
        run: |
          echo "NIX_PATH=nixpkgs=$(jq -r .pins.nixpkgs.url npins/sources.json)" >> "$GITHUB_ENV"
      - name: Resolve systems
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          # Already built by the build job on this shared store, so this is
          # just an evaluation; it rebuilds/substitutes only if it was GC'd.
          # Every hive node at once (colmena evaluates them in parallel); if
          # that fails (a profile that did not build), fall back to one node
          # at a time and keep the ones that do.
          rm -f .gcroots/node-*
          if ! nix-shell -p colmena --run "colmena build --no-build-on-target --keep-result"; then
            echo "::warning::building every node at once failed, retrying node by node"
            for node in $(nix-instantiate --eval --strict --json tests/repo.nix -A hiveNodes | jq -r '.[]'); do
              nix-shell -p colmena --run "colmena build --on '$node' --no-build-on-target --keep-result" ||
                echo "::warning::$node does not build, not pushing it"
            done
          fi
          builds=()
          for root in .gcroots/node-*; do
            [ -e "$root" ] && builds+=("$(readlink -e "$root")")
          done
          if [ ${#builds[@]} -eq 0 ]; then
            echo "::error::no system was built, nothing to push"
            exit 1
          fi
          printf '%s\n' "${builds[@]}" > "$RUNNER_TEMP/builds"
      - name: Push to cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_ID }}
          CACHE_PRIVATE_KEY: ${{ secrets.CACHE_PRIVATE_KEY }}
        # Only the paths cache.nixos.org doesn't serve, through a local
        # staging cache: `nix copy` straight to S3 refuses a path whose
        # references (stock packages, on cache.nixos.org) aren't in S3 too.
        # See .github/push-cache.sh.
        run: |
          key="$RUNNER_TEMP/cache-priv.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$CACHE_PRIVATE_KEY" > "$key"
          # The systems resolved above ($RUNNER_TEMP/builds), one per line;
          # expanded in nix-shell's shell, hence the single quotes.
          # shellcheck disable=SC2016
          CACHE_KEY="$key" nix-shell -p awscli2 jq curl --run \
            'mapfile -t builds < "$RUNNER_TEMP/builds" && bash .github/push-cache.sh "${builds[@]}"'
